# Caller-owned public NuGet development publisher.
# Deterministic version/build/collision logic lives in pinned Gizmo.Infra
# composite actions; the OIDC-requesting job identity remains in this repository.
#
# Pilot state: manual-dispatch only. Do not add automatic version-3 publishing
# until that branch is protected and the corresponding NuGet.org Trusted
# Publishing policy is intentionally enabled.
name: Package Development

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: nuget-${{ github.repository }}-Gizmo.Shared
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare development package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package-artifact: ${{ steps.prepare.outputs.package-artifact }}
      package-version: ${{ steps.prepare.outputs.package-version }}
      calculated-state: ${{ steps.prepare.outputs.calculated-state }}
      tag-state-fingerprint: ${{ steps.prepare.outputs.tag-state-fingerprint }}
    steps:
      - id: prepare
        name: Calculate, build, pack, and validate
        uses: GAMP/Gizmo.Infra/.github/actions/package-development-prepare@de3b92f68fc21e9003b83f522039b5ee7aea1a76
        with:
          project-path: Gizmo.Shared.csproj
          package-id: Gizmo.Shared
          package-visibility: public
          nuget-user: ${{ vars.NUGET_USER }}

  publish:
    name: Publish development package
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Recheck and publish with caller-owned OIDC
        uses: GAMP/Gizmo.Infra/.github/actions/package-development-public@de3b92f68fc21e9003b83f522039b5ee7aea1a76
        with:
          package-id: Gizmo.Shared
          nuget-user: ${{ vars.NUGET_USER }}
          package-artifact: ${{ needs.prepare.outputs.package-artifact }}
          package-version: ${{ needs.prepare.outputs.package-version }}
          calculated-state: ${{ needs.prepare.outputs.calculated-state }}
          tag-state-fingerprint: ${{ needs.prepare.outputs.tag-state-fingerprint }}
