# Thin caller for the committed reusable Gizmo.Infra NuGet validation workflow.
# Validation calculates, restores, audits, builds, packs, and retains a
# nonpublished package. It cannot publish or tag.
# The reusable workflow reference is pinned to an immutable full commit SHA.
name: Package Validation

on:
  pull_request:
    branches:
      - "version-3"
      - "release"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate package
    uses: GAMP/Gizmo.Infra/.github/workflows/package-validation.yml@de3b92f68fc21e9003b83f522039b5ee7aea1a76
    with:
      project-path: Gizmo.Shared.csproj
      package-id: Gizmo.Shared
      package-visibility: public
